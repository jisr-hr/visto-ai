# Deployment configuration. Copy to config.local.yml (git-ignored) and adjust.
# An unknown key anywhere in this file is an error.
# A secret is never written here; it is named by reference: { env: VARIABLE_NAME }.

model:
  # Base URL of the chat-completions endpoint.
  baseUrl: https://openrouter.ai/api/v1
  # The API key, read from this environment variable (sent as a bearer token).
  apiKey: { env: OPENROUTER_API_KEY }
  # The model to ask first.
  model: vendor/model-a
  # Models to try, in order, when the first one fails.
  fallbacks: []
  # Provider fragments merged into the request body for each effort level.
  effort:
    # Used for ordinary pull requests.
    default: {}
    # Used for large pull requests or those that target a primary branch.
    elevated: { reasoning: { effort: high } }
  # Extra fields merged into every request body.
  extraBody: {}
  # Extra headers sent with every request.
  extraHeaders: {}
  # Prices for an endpoint that reports no cost with its answers (OpenRouter does report it), in the currency you write them in.
  # With neither a reported cost nor prices, the cost is 0 and the daily limit cannot see it.
  prices: null
  # prices: { inputPerMillion: 1.0, cachedInputPerMillion: 0.1, outputPerMillion: 4.0 }
  # How long one model call may take, at most 300.
  timeoutSeconds: 240
  # How the model is made to answer through submit_review.
  # forced: every request names the tool. It is what you get when this is not written.
  # auto: for a model whose endpoint refuses a request that names a tool, as some newer models' endpoints do (every review
  # then fails with a provider error). The model is asked to call the tool and may answer in prose instead, which costs
  # one more request; two such answers fail that part of the review. The eval commands honour this key too.
  toolChoice: forced

limits:
  # Input tokens allowed in one model call. With MCP servers named, under about 34,000 the tools never fit:
  # every review then records each server as skipped with no_room, and nothing alerts.
  inputTokensPerCall: 200000
  # Batches of files allowed in one review.
  batchesPerReview: 6
  # The most the service may spend on model calls in one UTC day, in the unit of the recorded costs (US dollars with OpenRouter).
  spendPerDay: 50
  # How many review jobs may run at once (1 to 20).
  queueConcurrency: 2

# true: reviews are run and recorded in the database, and nothing is posted to the git service.
# false: the service posts reviews, and answers /review comments, on real pull requests.
# It is true when not written: the service posts only when this is false.
dryRun: true

# false: nothing is learned, and no review is shown anything learned. It is false when not written.
# true: three things are learned from what people do on pull requests.
# When a pull request closes, the service records where a person with access to the repository, other than the
# author, commented on the code, and later reviews of that repository are told where people stepped in before, as
# context for the score. The start of what the person wrote, 200 characters at most, is stored for the UI to come.
# It is never sent to the model.
# When the first line of a merged pull request's description is exactly the line GitHub's revert button writes
# for an earlier one, the files of the reverted pull request are recorded, and later reviews of that repository
# are told that a change to such a file was reverted, as context for the score. The number named is stored
# whether or not learning is on; nothing else of a description is.
# Once in a UTC day, each reply a person wrote under one of the reviewer's findings is sent to the model with that
# finding, to be judged: the reply's own words (what it quotes is left out), one model call for a reply, at most
# 100 replies a run and at most 20 of them from accounts with no access, counted in limits.spendPerDay.
# A reply by a person with access that shows a finding was wrong may become a lesson: one sentence the model
# writes, shown as data to later reviews of that repository for 90 days.
# Until the UI exists a record is switched off only in the database: see "Memory" in the README.
learning: false

# Optional second scorer: a decision model that scores the changed blocks in place of the review model.
# Naming one sends the reviewed code to that provider too, and then
# repositories.defaults.score.threshold must be written below.
# scorer:
#   # Base URL of the scorer's API.
#   baseUrl: https://openrouter.ai/api/alpha
#   # The environment variable that holds the scorer's key.
#   apiKey: { env: SCORER_API_KEY }
#   # The decision model to call.
#   model: vendor/decision-model
#   # Seconds to wait for one scorer call (at most 300).
#   timeoutSeconds: 60

# Needed only to run the service (not for the eval commands).
# app:
#   # The app's id, a whole number from 1 up.
#   id: 12345
#   # The environment variable that holds the app's RSA private key in PEM form.
#   # A key written on one line with backslash-n for each line break is accepted.
#   privateKey: { env: APP_PRIVATE_KEY }
#   # The environment variable that holds the secret set on the app's webhook.
#   webhookSecret: { env: WEBHOOK_SECRET }
#   # Only when ui below names who may sign in through GitHub: the client id the app's settings page shows, and the variable that holds
#   # the client secret generated there. Each of the two stays a comment until you remove its inner "# ".
#   # clientId: Iv1.0123456789abcdef
#   # clientSecret: { env: APP_CLIENT_SECRET }
# database:
#   # The environment variable that holds the Postgres URL (postgres:// or postgresql://); it contains a password.
#   url: { env: DATABASE_URL }
# server:
#   # The port the service listens on (1 to 65535). It is 8080 when not written.
#   port: 8080
# alerts:
#   # The environment variable that holds the URL (http or https) that gets the alerts: model_error, model_ok, spend_80, spend_limit, cost_unknown, redelivery_failed, feature_off, gate_check_failed, gate_bypass, extension_error, extension_ok, mcp_error, mcp_ok, memory_error, memory_ok, learning_stale, lessons_stale, dismissal_failed and stale_approval_merged.
#   webhook: { env: ALERT_WEBHOOK_URL }

# The web UI at <publicUrl>/ui/. It is on when publicUrl is written; with none of publicUrl, accounts and team it is off, and /ui/ and
# /api/ answer 404. Its accounts are made by an admin in Settings, and the first admin by the command npm run accounts (README, The UI).
# accounts and team name who may also sign in through the GitHub App, as a viewer until an admin says otherwise; with either,
# app.clientId and app.clientSecret must be written too, and on the app's settings page the callback URL is <publicUrl>/api/auth/callback.
# With team, install the app on that organisation with Members read. Everyone signed in sees the activity of every repository.
# ui:
#   publicUrl: https://visto.example.test
#   accounts: [octo-lead]
#   team: acme/reviewers

# The audit sample's key (see auditShare under repositories), named by reference: the secret its draw is keyed with, so that
# nobody without it can tell beforehand which pull request will be drawn. At least 32 characters, for example the output of
# openssl rand -hex 32. Required while autoApprove is true with an auditShare above 0; a key written must be set. A new key draws
# every pull request again.
# auditKey: { env: AUDIT_KEY }

# Optional extension modules: code of your own that the service loads once, at start. A module can give the reviewer
# context about a pull request (a ticket's text, acceptance criteria), be told when a review is published and when an
# alert is raised, and answer HTTP requests under /extensions/<name>/, for example to collect a thumbs up or down.
# docs/extensions.md states the contract, and examples/extension-example.ts is a module that works.
# A module runs inside the service and can reach whatever the service can: name only code you trust.
# A module that cannot be loaded stops the start. In dry run a module is asked for context, and it is told of no review and no alert.
# Under Docker the module's file must be mounted into the container; docs/extensions.md says how.
# extensions:
#     # The module's name in logs and in its route: a lower-case letter, then lower-case letters, digits or underscores, at most 40.
#   - name: example
#     # A path (relative to this file when it starts with ./ or ../), or the name of a package the service can import.
#     module: ./examples/extension-example.ts
#     # Handed to the module as written. A secret is named by reference, anywhere inside: { env: VARIABLE_NAME }.
#     options:
#       secret: { env: EXAMPLE_FEEDBACK_SECRET }

# Optional MCP servers: tools the review model may call while it reviews, for example a search in your documentation.
# The service speaks revision 2025-11-25 of the protocol (a server may answer with 2025-06-18 or 2025-03-26), over
# Streamable HTTP, with the headers written here. A server started as a local process (stdio), OAuth and the newest
# revision are not supported. Nothing is asked at start: a wrong address or key shows at the first review.
# A review makes at most 8 calls in all. What a tool returns is shown to the model as data, cut at 8,000 characters.
# What the model sends as arguments goes to the server, and what a tool returns can be written in the review:
# name only a server you trust with the reviewed code, and only tools that read.
# A server's tool names, descriptions and schemas are trusted like this file. No server is asked for a pull request from a fork.
# Servers are asked in dry run too; the eval commands ask none. The README's section "MCP tools (optional)" says what it costs.
# mcpServers:
#     # The server's name in records, alerts and tool names: a lower-case letter, then lower-case letters, digits or underscores, at most 20.
#   - name: docs
#     # The server's address (http or https). A redirect is not followed. A secret never goes here: put it in a header.
#     url: https://docs.example.test/mcp
#     # Sent with every request to the server. A secret is named by reference: { env: VARIABLE_NAME }.
#     headers:
#       Authorization: { env: DOCS_MCP_AUTHORIZATION }
#     # The tools the model may be offered, by the names the server lists (1 to 20). No other tool of the server is offered.
#     tools: [search]

repositories:
  # Settings for every repository.
  defaults:
    # Branches that count as primary; a pull request targeting one gets elevated effort.
    primaryBranches: [main, master]
    # Pull requests by these logins are not reviewed. It is [dependabot[bot]] when not written.
    ignoredAuthors: ['dependabot[bot]']
    # Only pull requests that target one of these branches are reviewed; empty means every branch.
    baseBranches: []
    # How a new head of a pull request that already has a review is reviewed.
    #   full:        reads every file again, and costs about what a first review costs.
    #   incremental: reads the files that changed or that no review has read, and the files with a thread due a verdict;
    #                a defect left in code that has not changed is then not found. Not written means incremental, except on a gated
    #                pull request (the merge gate below is enabled, its branches name the base branch, and its mode is enforce or
    #                bypass), where not written means full. In shadow, and on a pull request that is not gated, it is incremental.
    # A first review, a head on another base branch and a /review on the last review's head and base ignore it.
    # newHead: incremental
    # A changed block scored at or above this (1 to 100) is listed for a human reviewer.
    # It is 70 when not written, and must be written when a scorer is named.
    # inlineNotes switches on a short comment in the diff for each block listed for a human reviewer: at most 50 a review,
    # the highest scores first, none twice. A note is an ordinary review thread, so where a repository requires resolved
    # conversations someone must resolve each one; the app never does. It can be set for all repositories and for one.
    # It is false when not written.
    # autoApprove posts a review as an approval when every file is reviewed, nothing is at or above the threshold, no major or blocker
    # finding is open, the pull request is no draft and not from a fork, the base branch dismisses stale approvals (a ruleset's
    # pull request rule, or branch protection), and the pull request is not drawn for the audit sample (auditShare). The app then
    # needs Administration read. It is false when not written.
    # approvalThreads: strict, a thread closes for approval when a review verified a fix in changed code, or when someone other than the
    # author, with access, replied and it is resolved; gate, as the merge gate's rule clears it. It is strict when not written.
    # auditShare: of the pull requests autoApprove would approve, the percentage (0 to 100) sent to a person anyway as an audit sample,
    # drawn by a keyed hash of the pull request, so that pushing again does not draw it again; its review says it was drawn. It is 5 when
    # not written, and 0 switches the sample off. Above 0, with autoApprove true, the top-level auditKey must be written.
    # score:
    #   threshold: 70
    #   inlineNotes: false
    #   autoApprove: false
    #   approvalThreads: strict
    #   auditShare: 5

    # The merge gate. A pull request is gated when its repository has the gate enabled and its base branch is listed in branches
    # (compared exactly, case and all). A gated pull request is not reviewed when someone pushes; it is reviewed when someone
    # comments /done or /review, or re-runs the check in GitHub. Until then its check says it waits for /done.
    # After a review the check stays red while a major or blocker finding is neither verified by the review of the current head
    # nor answered by a person in a resolved thread; a person's reply and a resolve turn it green with no new review.
    # The check must also be made required in GitHub (a ruleset or branch protection on the same branches, naming the check and this app);
    # the service cannot do that, and until it is done nothing holds a merge.
    # None of this can be set from inside a reviewed repository: only this file sets it. Each key can be set for all repositories here
    # or for one under overrides below. In dry run no check is written, and /done is a /review.
    # The app needs Checks read and write and the event Check run; Commit statuses read when requiredChecks are named; the
    # organisation permission Members read when skipTeam is named. An app made by npm run app:create has them. An existing app is given
    # them by hand in its settings, each installation accepts them, and the service is restarted: it reads them once, at start.
    # Switch it on in shadow mode first. The README's section "The merge gate (optional)" says what it does and what it costs.
    #   enabled:       the gate is off when not written, and then nothing here has any effect.
    #   branches:      the base branches that are gated. Required when the gate is enabled; there is no default list.
    #   checkName:     the name of the check, 1 to 100 printable ASCII characters. It is "AI Review" when not written.
    #   mode:          enforce writes the check as described above. shadow writes it too, but a push is reviewed as without a gate,
    #                  so the gate can be watched before it is relied on. bypass writes a passing check on every gated pull request
    #                  and reviews only when asked. It is enforce when not written.
    #   clearByReply:  true: a person's reply in a thread and a resolve clear a blocking finding. false: only a new review that
    #                  verifies it, or a skip, gets past one. It is true when not written.
    #   skipTeam:      "<org>/<team-slug>", the one team whose members may comment /ai-review-skip <reason> to pass one commit.
    #                  The org must own the repository. Not written means nobody may skip. The team's name is written nowhere on GitHub.
    #   requiredChecks: names of other checks or statuses that /done reads before it says a head is already green (success only).
    # gate:
    #   enabled: true
    #   branches: [main]
    #   checkName: AI Review
    #   mode: enforce
    #   clearByReply: true
    #   skipTeam: acme/release-managers
    #   requiredChecks: [build]
  # Per-repository changes, keyed by "owner/name"; each replaces only the keys it sets.
  overrides:
    acme/shop: { primaryBranches: [trunk], baseBranches: [trunk], score: { threshold: 60 } }

# Deployment configuration. Copy to config.local.yml (git-ignored) and adjust.
# An unknown key anywhere in this file is an error.
# A secret is never written here; it is named by reference: { env: VARIABLE_NAME }.

model:
  # Base URL of the chat-completions endpoint.
  baseUrl: https://openrouter.ai/api/v1
  # The API key, read from this environment variable (sent as a bearer token).
  apiKey: { env: OPENROUTER_API_KEY }
  # The model to ask first.
  model: vendor/model-a
  # Models to try, in order, when the first one fails.
  fallbacks: []
  # Provider fragments merged into the request body for each effort level.
  effort:
    # Used for ordinary pull requests.
    default: {}
    # Used for large pull requests or those that target a primary branch.
    elevated: { reasoning: { effort: high } }
  # Extra fields merged into every request body.
  extraBody: {}
  # Extra headers sent with every request.
  extraHeaders: {}
  # Prices for an endpoint that reports no cost with its answers (OpenRouter does report it), in the currency you write them in.
  # With neither a reported cost nor prices, the cost is 0 and the daily limit cannot see it.
  prices: null
  # prices: { inputPerMillion: 1.0, cachedInputPerMillion: 0.1, outputPerMillion: 4.0 }
  # How long one model call may take, at most 300.
  timeoutSeconds: 240

limits:
  # Input tokens allowed in one model call.
  inputTokensPerCall: 200000
  # Batches of files allowed in one review.
  batchesPerReview: 6
  # The most the service may spend on model calls in one UTC day, in the unit of the recorded costs (US dollars with OpenRouter).
  spendPerDay: 50
  # How many review jobs may run at once (1 to 20).
  queueConcurrency: 2

# true: reviews are run and recorded in the database, and nothing is posted to the git service.
# false: the service posts reviews, and answers /review comments, on real pull requests.
# It is true when not written: the service posts only when this is false.
dryRun: true

# Optional second scorer: a decision model that scores the changed blocks in place of the review model.
# Naming one sends the reviewed code to that provider too, and then
# repositories.defaults.score.threshold must be written below.
# scorer:
#   # Base URL of the scorer's API.
#   baseUrl: https://openrouter.ai/api/alpha
#   # The environment variable that holds the scorer's key.
#   apiKey: { env: SCORER_API_KEY }
#   # The decision model to call.
#   model: vendor/decision-model
#   # Seconds to wait for one scorer call (at most 300).
#   timeoutSeconds: 60

# Needed only to run the service (not for the eval commands).
# app:
#   # The app's id, a whole number from 1 up.
#   id: 12345
#   # The environment variable that holds the app's RSA private key in PEM form.
#   # A key written on one line with backslash-n for each line break is accepted.
#   privateKey: { env: APP_PRIVATE_KEY }
#   # The environment variable that holds the secret set on the app's webhook.
#   webhookSecret: { env: WEBHOOK_SECRET }
# database:
#   # The environment variable that holds the Postgres URL (postgres:// or postgresql://); it contains a password.
#   url: { env: DATABASE_URL }
# server:
#   # The port the service listens on (1 to 65535). It is 8080 when not written.
#   port: 8080
# alerts:
#   # The environment variable that holds the URL (http or https) that gets the alerts: model_error, model_ok, spend_80, spend_limit, cost_unknown, redelivery_failed, feature_off, gate_check_failed and gate_bypass.
#   webhook: { env: ALERT_WEBHOOK_URL }

repositories:
  # Settings for every repository.
  defaults:
    # Branches that count as primary; a pull request targeting one gets elevated effort.
    primaryBranches: [main, master]
    # Pull requests by these logins are not reviewed. It is [dependabot[bot]] when not written.
    ignoredAuthors: ['dependabot[bot]']
    # Only pull requests that target one of these branches are reviewed; empty means every branch.
    baseBranches: []
    # How a new head of a pull request that already has a review is reviewed.
    #   full:        reads every file again, and costs about what a first review costs.
    #   incremental: reads the files that changed or that no review has read, and the files with a thread due a verdict;
    #                a defect left in code that has not changed is then not found. Not written means incremental, except on a gated
    #                pull request (the merge gate below is enabled, its branches name the base branch, and its mode is enforce or
    #                bypass), where not written means full. In shadow, and on a pull request that is not gated, it is incremental.
    # A first review, a head on another base branch and a /review on the last review's head and base ignore it.
    # newHead: incremental
    # A changed block scored at or above this (1 to 100) is listed for a human reviewer.
    # It is 70 when not written, and must be written when a scorer is named.
    # inlineNotes switches on a short comment in the diff for each block listed for a human reviewer: at most 50 a review,
    # the highest scores first, none twice. A note is an ordinary review thread, so where a repository requires resolved
    # conversations someone must resolve each one; the app never does. It can be set for all repositories and for one.
    # It is false when not written.
    # score:
    #   threshold: 70
    #   inlineNotes: false

    # The merge gate. A pull request is gated when its repository has the gate enabled and its base branch is listed in branches
    # (compared exactly, case and all). A gated pull request is not reviewed when someone pushes; it is reviewed when someone
    # comments /done or /review, or re-runs the check in GitHub. Until then its check says it waits for /done.
    # After a review the check stays red while a major or blocker finding is neither verified by the review of the current head
    # nor answered by a person in a resolved thread; a person's reply and a resolve turn it green with no new review.
    # The check must also be made required in GitHub (a ruleset or branch protection on the same branches, naming the check and this app);
    # the service cannot do that, and until it is done nothing holds a merge.
    # None of this can be set from inside a reviewed repository: only this file sets it. Each key can be set for all repositories here
    # or for one under overrides below. In dry run no check is written, and /done is a /review.
    # The app needs Checks read and write and the event Check run; Commit statuses read when requiredChecks are named; the
    # organisation permission Members read when skipTeam is named. An app made by npm run app:create has them. An existing app is given
    # them by hand in its settings, each installation accepts them, and the service is restarted: it reads them once, at start.
    # Switch it on in shadow mode first. The README's section "The merge gate (optional)" says what it does and what it costs.
    #   enabled:       the gate is off when not written, and then nothing here has any effect.
    #   branches:      the base branches that are gated. Required when the gate is enabled; there is no default list.
    #   checkName:     the name of the check, 1 to 100 printable ASCII characters. It is "AI Review" when not written.
    #   mode:          enforce writes the check as described above. shadow writes it too, but a push is reviewed as without a gate,
    #                  so the gate can be watched before it is relied on. bypass writes a passing check on every gated pull request
    #                  and reviews only when asked. It is enforce when not written.
    #   clearByReply:  true: a person's reply in a thread and a resolve clear a blocking finding. false: only a new review that
    #                  verifies it, or a skip, gets past one. It is true when not written.
    #   skipTeam:      "<org>/<team-slug>", the one team whose members may comment /ai-review-skip <reason> to pass one commit.
    #                  The org must own the repository. Not written means nobody may skip. The team's name is written nowhere on GitHub.
    #   requiredChecks: names of other checks or statuses that /done reads before it says a head is already green (success only).
    # gate:
    #   enabled: true
    #   branches: [main]
    #   checkName: AI Review
    #   mode: enforce
    #   clearByReply: true
    #   skipTeam: acme/release-managers
    #   requiredChecks: [build]
  # Per-repository changes, keyed by "owner/name"; each replaces only the keys it sets.
  overrides:
    acme/shop: { primaryBranches: [trunk], baseBranches: [trunk], score: { threshold: 60 } }

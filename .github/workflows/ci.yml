name: ci
on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    container: node:26-bookworm-slim
    steps:
      # The slim image has no git: without it checkout downloads the files
      # with no .git folder, and the guide check lists tracked files with git.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix ui run lint
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
